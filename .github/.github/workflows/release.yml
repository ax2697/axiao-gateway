name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        run: npm install

      - name: Build exe
        run: npx tauri build --no-bundle

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item src-tauri/target/release/axiao-gateway.exe release/ -Force
          Copy-Item config.example.json release/ -Force
          Copy-Item docs/USAGE.txt release/使用说明.txt -Force
          Copy-Item docs/GETTING-STARTED.md release/新手教程.md -Force
          $dll = Get-ChildItem -Path src-tauri/target -Recurse -Filter WebView2Loader.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName release/WebView2Loader.dll -Force }
          Get-ChildItem release | Format-Table Name, Length -AutoSize

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/axiao-gateway.exe
            release/WebView2Loader.dll
            release/config.example.json
            release/使用说明.txt
            release/新手教程.md
